name: Release

on:
  push:
    tags: ["v*"]

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 連続して打ったタグを取りこぼさないよう、キャンセルせず順に流す。
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  # 版の知らせ（latest.json）の署名を確かめる公開鍵（X.509 SubjectPublicKeyInfo の DER を base64）。
  # アプリへ埋め込んである値と同じでなければならない。
  MANIFEST_PUBLIC_KEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEGqes4mE7TNzloY14nqHF6zB7bXa2COwF1qT9/4vktP0+rDMQsZEtWy2/KnoGoxiQh1UIB83jXkgekgD2XfCsmg=="

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.compute.outputs.name }}
    steps:
      # 版はタグ名から v を除いたもの。インストーラの版数は major.minor.patch しか受け付けない。
      - name: Compute version
        id: compute
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "タグは vMAJOR.MINOR.PATCH の形で打つこと（受け取った値: $GITHUB_REF_NAME）" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$name"

      # 配布中の版より新しいことを確かめる。古い版や同じ版を公開すると、入れてあるアプリには更新として届かない。
      - name: Verify version increases
        env:
          VERSION_NAME: ${{ steps.compute.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/${REPOSITORY}/releases/download/latest/latest.json"
          published=$(curl -fsSL "$url" | jq -r '.desktop.versionName') || {
            echo "::warning::配布中の latest.json を取得できませんでした。版の比較を省きます"
            exit 0
          }
          newest=$(printf '%s\n%s\n' "$published" "$VERSION_NAME" | sort -V | tail -n 1)
          if [ "$published" = "$VERSION_NAME" ] || [ "$newest" != "$VERSION_NAME" ]; then
            echo "版が新しくなっていません（配布中 $published → 今回 $VERSION_NAME）" >&2
            exit 1
          fi
          echo "version: $published → $VERSION_NAME"

  # テストを通してから配布物を作る。ここが落ちれば公開まで進まない。
  desktop:
    needs: [version]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # リポジトリに置いている gradle-wrapper.jar が公式のものであることを確かめる。
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew check --console=plain

      - name: Build MSI
        run: >
          ./gradlew :desktopApp:packageMsi
          "-Plegirss.version=${{ needs.version.outputs.name }}"
          --console=plain

      - name: Collect MSI
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI が生成されていません" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $msi.FullName artifacts/legirss.msi

      # 配布物はリリースへ載る。成果物として要るのは後のジョブへ渡すまでなので、保持期間を最短にする。
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: artifacts/legirss.msi
          if-no-files-found: error
          retention-days: 1

  # 配布物の照合値から版の知らせを作り、署名する。公開の権限は持たず、成果物として release へ渡す。
  # 署名の鍵を持つのはこのジョブだけで、リリースを書き換える権限とは同居させない。
  manifest:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write latest.json
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          msi_sha=$(sha256sum artifacts/legirss.msi | cut -d' ' -f1)
          jq -n --arg versionName "$VERSION_NAME" --arg msiSha "$msi_sha" \
            '{ desktop: { versionName: $versionName, sha256: $msiSha } }' > artifacts/latest.json
          cat artifacts/latest.json

      # latest.json のバイト列へ署名する。アプリは署名を確かめてからでないと中身を読まない。
      # 鍵は環境変数で受け取り、権限を絞った一時ファイルへ書いて使い、ジョブを抜けるときに消す。
      # 引数へ載せるとプロセスの一覧から読める。
      - name: Sign latest.json
        env:
          SIGNING_KEY: ${{ secrets.LEGIRSS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "LEGIRSS_SIGNING_KEY が未設定です" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/manifest-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          openssl dgst -sha256 -sign "$key_file" artifacts/latest.json |
            base64 -w0 > artifacts/latest.json.sig

          # アプリが持つ公開鍵で確かめてから配る。鍵が食い違ったまま公開すると、
          # 入れてあるアプリがどれも更新できなくなる。
          printf '%s' "$MANIFEST_PUBLIC_KEY" | base64 -d > "$RUNNER_TEMP/manifest-public-key.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/manifest-public-key.der" \
            -out "$RUNNER_TEMP/manifest-public-key.pem"
          base64 -d artifacts/latest.json.sig > "$RUNNER_TEMP/latest.json.sig.der"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/manifest-public-key.pem" \
            -signature "$RUNNER_TEMP/latest.json.sig.der" artifacts/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: |
            artifacts/latest.json
            artifacts/latest.json.sig
          if-no-files-found: error
          retention-days: 1

  # 成果物を公開するだけのジョブ。contents: write を持つのはここだけ。
  release:
    needs: [version, desktop, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 版ごとのリリース。配布物の実物が残るので、どの版で何を配ったかを後から辿れる。
      # 配布物を書き込む唯一の外部のコードなので、動かせるタグではなくコミットで固定する。
      - name: Publish versioned release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.version.outputs.name }}
          body: |
            legirss ${{ needs.version.outputs.name }}

            配布中の版として `latest` にも同じ配布物を置いている。
          files: |
            artifacts/legirss.msi

      # 更新の経路。入れてあるアプリは latest から版の知らせと配布物を取得するため、
      # 置き場所を動かさずに中身だけを差し替える。
      - name: Update latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            配布中の版（${{ needs.version.outputs.name }}）。
          prerelease: true
          files: |
            artifacts/legirss.msi
            artifacts/latest.json
            artifacts/latest.json.sig
